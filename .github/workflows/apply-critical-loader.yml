name: Apply critical loader

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-critical-loader.cjs'
      - '.github/workflows/apply-critical-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without marketplace action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Inject critical loader and direct design assets
        run: node scripts/apply-critical-loader.cjs

      - name: Commit generated page updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shop.html product-details.html privacy-policy.html returns-policy.html consent.html terms-of-use.html
          git commit -m "Apply critical Maltezos boot screen to public pages"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
