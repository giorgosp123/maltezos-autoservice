<!DOCTYPE html>
<html lang="el" data-maltezos-core="pages/product-details-core.html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <title>Maltezos Autoservice | Λεπτομέρειες Προϊόντος</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050607;color:#fff;font-family:Arial,sans-serif}body{min-height:100svh;overflow:hidden}.mz-shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(239,35,60,.14),transparent 32%),#050607}.mz-shell-inner{text-align:center;width:min(82vw,420px)}.mz-shell-logo{display:block;width:min(300px,70vw);height:auto;margin:0 auto 18px;filter:drop-shadow(0 18px 42px rgba(0,0,0,.38))}.mz-shell-sub{margin-top:9px;color:rgba(255,255,255,.48);font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}.mz-shell-track{width:min(210px,58vw);height:2px;margin:24px auto 0;background:#25272b;overflow:hidden}.mz-shell-bar{width:38%;height:100%;background:#ef233c;animation:mzload 1s ease-in-out infinite}.mz-shell-message{margin-top:16px;color:rgba(255,255,255,.35);font-size:10px;letter-spacing:.12em;text-transform:uppercase}@keyframes mzload{from{transform:translateX(-120%)}to{transform:translateX(360%)}}@media(prefers-reduced-motion:reduce){.mz-shell-bar{animation:none;width:100%}}
  </style>
</head>
<body>
  <div class="mz-shell" aria-label="Loading Maltezos Product">
    <div class="mz-shell-inner">
      <img class="mz-shell-logo" src="assets/icons/IMG_53591-removebg-preview.png" alt="Maltezos Autoservice" />
      <div class="mz-shell-sub">Product / Transmission</div>
      <div class="mz-shell-track"><div class="mz-shell-bar"></div></div>
      <div class="mz-shell-message">Loading</div>
    </div>
  </div>
  <script src="assets/js/core-bootstrap.js?v=1"></script>
</body>
</html>
